server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    # This assumes the frontend code uses relative paths or we handle base URL in JS
    # However, since we defined API_BASE = "http://localhost:8001", 
    # the browser will try to hit the host's 8001 directly.
}
